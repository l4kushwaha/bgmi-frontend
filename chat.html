<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat | BGMI Market</title>
<link rel="stylesheet" href="assets/webfonts/poppins.css">
<link rel="stylesheet" href="assets/effects.css">

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body { background:#0b141a; color:#fff; overflow:hidden; }
.app { display:flex; height:100vh; }

/* ========== SIDEBAR ========== */
.sidebar {
  width:340px; background:#111b21; display:flex; flex-direction:column;
  border-right:1px solid rgba(255,255,255,.08);
}
.sidebar-header {
  padding:10px 10px 8px; border-bottom:1px solid rgba(255,255,255,.08);
}
.sidebar-header .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.sidebar-header .top .logo { font-weight:800; font-size:1.05rem; }
.sidebar-header input {
  width:100%; padding:8px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05); color:#fff; outline:none; font-size:.9rem;
}
.sidebar-header input:focus { border-color:#0ff; box-shadow:0 0 10px rgba(0,255,198,.3); }
#onlineStatus { margin-top:6px; font-size:12px; color:#25d366; }

#chatList { flex:1; overflow-y:auto; }
.chat-item { padding:12px; border-bottom:1px solid rgba(255,255,255,.05); cursor:pointer; transition:.2s; }
.chat-item:hover, .chat-item.active { background:#202c33; }
.chat-title { font-weight:700; color:#fff; font-size:.92rem; }
.chat-preview { font-size:13px; color:#aaa; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chat-meta { font-size:11px; color:#25d366; margin-top:2px; }

/* ========== CHAT PANEL ========== */
.chat-panel { flex:1; display:flex; flex-direction:column; background:#0b141a; min-width:0; }
.chat-header {
  padding:10px 14px; background:#202c33; display:flex; justify-content:space-between;
  align-items:center; gap:.6rem; border-bottom:1px solid rgba(255,255,255,.08);
}
#chatStatus { font-weight:700; font-size:.95rem; }
.chat-header .exit { font-size:.75rem; color:#aaa; cursor:pointer; border:1px solid rgba(255,255,255,.15); padding:.25rem .6rem; border-radius:8px; transition:.2s; }
.chat-header .exit:hover { color:#ff5e5e; border-color:#ff5e5e; }

#chatBox { flex:1; padding:12px; overflow-y:auto; }

/* Messages */
.message { max-width:70%; padding:8px 12px; margin-bottom:8px; border-radius:12px; font-size:14px; word-break:break-word; }
.sent { background:#005c4b; color:#fff; margin-left:auto; border-bottom-right-radius:4px; }
.received { background:#202c33; color:#fff; border-bottom-left-radius:4px; }
.message.system { background:transparent; color:#ffcc00; text-align:center; font-size:.8rem; max-width:100%; }
img.chat-image { max-width:220px; border-radius:8px; display:block; }
.message audio { max-width:220px; height:34px; display:block; }
.g-time-inline { display:block; font-size:.65rem; opacity:.55; margin-top:3px; text-align:right; }

/* ========== WAITING / BUY ========== */
#waitingBox { padding:10px; text-align:center; color:#ffcc00; font-size:14px; }
#buyBox { display:none; padding:10px; background:#111b21; border-top:1px solid #222; text-align:center; }
#buyBox button { padding:10px 16px; border-radius:8px; border:none; background:linear-gradient(90deg,#ffcc00,#ff8800); cursor:pointer; font-weight:700; color:#221; }

/* ========== GLOBAL ========== */
.g-box { flex:1; overflow-y:auto; padding:12px; display:none; }
.g-box.open { display:block; }
.g-empty { text-align:center; color:rgba(255,255,255,.5); padding:2.5rem 1rem; }

/* ========== INPUT BAR ========== */
.chat-input { position:relative; display:flex; align-items:center; gap:.4rem; padding:8px; background:#202c33; }
.chat-input input[type="text"] {
  flex:1; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,.12);
  background:#111b21; color:#fff; outline:none; font-size:.92rem;
}
.chat-input input:focus { border-color:#0ff; }
.icon-btn {
  width:38px; height:38px; flex:none; border:none; border-radius:10px; cursor:pointer;
  font-size:1.05rem; background:rgba(255,255,255,.07); color:#fff; transition:.2s;
}
.icon-btn:hover { background:rgba(255,255,255,.16); }
.icon-btn.rec { background:#ff2d2d; box-shadow:0 0 14px rgba(255,45,45,.7); animation:pulse 1.2s infinite; }
#sendBtn {
  flex:none; padding:10px 18px; border:none; border-radius:10px; cursor:pointer; font-weight:800;
  color:#061; background:linear-gradient(90deg,#00ffc6,#22c55e); transition:.2s;
}
#sendBtn:hover { transform:translateY(-1px); box-shadow:0 0 16px rgba(0,255,198,.5); }
#sendBtn:disabled { opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }

/* ========== CALLING ========== */
.call-btn {
  flex:none; width:38px; height:38px; border:none; border-radius:50%;
  cursor:pointer; font-size:1.05rem; background:rgba(255,255,255,.08); color:#fff; transition:.2s;
  display:none;
}
.call-btn:hover { transform:translateY(-1px); }
#callAudioBtn:hover { background:#25d366; box-shadow:0 0 14px rgba(37,211,102,.6); }
#callVideoBtn:hover { background:#00c6ff; box-shadow:0 0 14px rgba(0,198,255,.6); }

.call-overlay {
  position:fixed; inset:0; z-index:999; display:none;
  align-items:center; justify-content:center; flex-direction:column; gap:.6rem;
  background:rgba(5,10,15,.94); backdrop-filter:blur(10px);
}
.call-overlay.open { display:flex; }
.call-avatar {
  width:96px; height:96px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:2.4rem; font-weight:800; color:#062;
  background:linear-gradient(90deg,#00ffc6,#22c55e);
  box-shadow:0 0 30px rgba(0,255,198,.45);
}
.call-name { font-size:1.15rem; font-weight:700; }
.call-state { font-size:.85rem; color:#aaa; }
.call-actions { display:flex; gap:.9rem; margin-top:.6rem; }
.call-action {
  width:56px; height:56px; border:none; border-radius:50%; cursor:pointer;
  font-size:1.4rem; color:#fff; transition:.2s;
}
.call-action.accept { background:linear-gradient(90deg,#00ffc6,#22c55e); box-shadow:0 0 18px rgba(0,255,198,.5); }
.call-action.decline, .call-action.end { background:#ff2d2d; box-shadow:0 0 18px rgba(255,45,45,.5); }
.call-action:hover { transform:scale(1.08); }
.call-ring { animation:pulse 1.2s infinite; }

#callVideoLocal, #callVideoRemote {
  position:fixed; border-radius:14px; object-fit:cover; border:2px solid rgba(255,255,255,.25);
}
#callVideoLocal { width:26vw; max-width:280px; aspect-ratio:3/4; right:14px; bottom:14px; z-index:1001; background:#000; }
#callVideoRemote { inset:0; width:100%; height:100%; z-index:998; background:#000; }

/* scrollbar */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,.15); border-radius:3px; }
@media (max-width:640px){ .sidebar{width:100%;} .app{flex-direction:column;} }
</style>
</head>
<body>

<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="top">
        <span class="logo anim-gradient"><span class="wiggle">💬</span> BGMI Chat</span>
        <span id="onlineStatus"></span>
      </div>
      <div class="ch-tabs">
        <div class="ch-tab active" id="tabGlobal">🌍 Global</div>
        <div class="ch-tab" id="tabChats">🎮 My Chats</div>
      </div>
      <div id="pillsBox"></div>
      <input id="searchChats" placeholder="Search chats" style="display:none">
    </div>
    <div id="chatList" class="chat-list"></div>
  </div>

  <!-- ===== MAIN PANEL ===== -->
  <div class="chat-panel">

    <!-- GLOBAL CHAT -->
    <div class="g-box open" id="globalBox">
      <div class="g-empty" id="gEmpty">🌍 Global chat — abhi tak koi message nahi. Pehla bano!<br><span style="font-size:.8rem;opacity:.7">3 sec gap ke saath message bhejo</span></div>
    </div>

    <!-- PRIVATE CHAT -->
    <div id="privateBox" style="display:none;flex:1;flex-direction:column;min-height:0;">
      <div class="chat-header">
        <div id="chatStatus">Select a chat</div>
        <div style="display:flex;gap:.5rem;align-items:center">
          <button class="call-btn" id="callAudioBtn" title="Voice call">📞</button>
          <button class="call-btn" id="callVideoBtn" title="Video call">📹</button>
          <span class="exit" id="exitPrivate" style="display:none">✕ Close</span>
        </div>
      </div>
      <div id="waitingBox"></div>
      <div id="chatBox"></div>
      <div id="buyBox">
        <button id="halfPayBtn">Pay 50% Advance</button>
      </div>
    </div>

    <!-- INPUT BAR -->
    <div class="chat-input">
      <div class="effects-pop" id="effectsPop">
        <span class="eff-chip sel" data-e="">✨ None</span>
        <span class="eff-chip" data-e="rainbow">🌈 Rainbow</span>
        <span class="eff-chip" data-e="glitch">⚡ Glitch</span>
        <span class="eff-chip" data-e="fire">🔥 Fire</span>
        <span class="eff-chip" data-e="sparkle">🎇 Sparkle</span>
        <span class="eff-chip" data-e="neon">🔮 Neon</span>
      </div>
      <button class="icon-btn" id="effBtn" title="Effects">✨</button>
      <button class="icon-btn" id="micBtn" title="Voice message">🎤</button>
      <button class="icon-btn" id="imgBtn" title="Send image" style="display:none">📷</button>
      <input type="text" id="messageInput" placeholder="Type a message… (Enter to send)">
      <input type="file" id="imageInput" hidden>
      <button id="sendBtn">Send</button>
    </div>

  </div>
</div>

<!-- notification sound -->
<audio id="notifySound">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-message-pop-alert-2354.mp3">
</audio>

<!-- ===== CALL OVERLAY ===== -->
<video id="callVideoRemote" playsinline autoplay muted style="display:none"></video>
<video id="callVideoLocal" playsinline autoplay muted style="display:none"></video>
<div class="call-overlay" id="callOverlay">
  <div class="call-avatar" id="callAvatar">?</div>
  <div class="call-name" id="callName">Calling…</div>
  <div class="call-state" id="callState">Ringing…</div>
  <div class="call-actions">
    <button class="call-action accept" id="callAcceptBtn" style="display:none" title="Accept">📞</button>
    <button class="call-action decline" id="callDeclineBtn" title="Decline">✖</button>
    <button class="call-action end" id="callEndBtn" style="display:none" title="End call">🛑</button>
  </div>
</div>

<!-- MAIN CHAT SCRIPT -->
<script src="js/upi.js"></script>
<script src="js/chat.js"></script>
<script src="assets/effects.js" defer></script>

  <link rel="stylesheet" href="styles/responsive.css">
</body>
</html>
