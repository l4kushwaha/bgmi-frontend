<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallet | BGMI Market</title>
  <link rel="stylesheet" href="assets/webfonts/poppins.css">
  <link rel="stylesheet" href="assets/effects.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top left, #0b1026, #070810, #0d0a1f);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }
    .orb { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .35; z-index: 0; animation: drift 18s infinite ease-in-out; }
    .orb.a { width: 420px; height: 420px; background: #22c55e; top: -120px; left: -120px; }
    .orb.b { width: 380px; height: 380px; background: #8b5cf6; bottom: -100px; right: -100px; animation-delay: -6s; }
    .orb.c { width: 300px; height: 300px; background: #f59e0b; top: 40%; right: 10%; animation-delay: -12s; }
    @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,-30px); } }

    .wrap { position: relative; z-index: 1; width: 100%; max-width: 720px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2rem; animation: drop .6s ease both;
    }
    header h1 {
      font-size: 1.6rem;
      background: linear-gradient(90deg, #22c55e, #8b5cf6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    header a { color: #aaa; text-decoration: none; border: 1px solid #333; padding: .4rem .8rem; border-radius: 8px; transition: .3s; }
    header a:hover { color: #22c55e; border-color: #22c55e; box-shadow: 0 0 14px rgba(34,197,94,.35); }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat {
      background: rgba(255,255,255,.05); backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.1); border-radius: 16px;
      padding: 1.2rem; text-align: center;
      animation: pop .5s ease both;
    }
    .stat:nth-child(2) { animation-delay: .1s; } .stat:nth-child(3) { animation-delay: .2s; }
    .stat small { opacity: .6; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; }
    .stat .val { font-size: 1.5rem; font-weight: 700; margin-top: .3rem; }
    .stat.green .val { color: #22c55e; }
    .stat.orange .val { color: #ffb703; }
    .stat.violet .val { color: #a78bfa; }

    .panel {
      background: rgba(255,255,255,.05); backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.1); border-radius: 18px;
      padding: 1.5rem; margin-bottom: 1.5rem;
      animation: rise .5s ease both;
    }
    .panel h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #ffb703; }

    input {
      width: 100%; background: rgba(0,0,0,.35); border: 1px solid #333;
      color: #fff; padding: .7rem .9rem; border-radius: 10px; margin-bottom: .8rem;
      font-size: .95rem; transition: .3s;
    }
    input:focus { outline: none; border-color: #22c55e; box-shadow: 0 0 12px rgba(34,197,94,.3); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }

    .btn {
      width: 100%; padding: .8rem; border: none; border-radius: 12px; cursor: pointer;
      font-weight: 700; font-size: 1rem; color: #062; background: linear-gradient(90deg,#22c55e,#16a34a);
      transition: .3s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(34,197,94,.4); }

    .wd-item {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0,0,0,.25); border: 1px solid #222; border-radius: 12px;
      padding: .8rem 1rem; margin-bottom: .6rem;
    }
    .wd-item small { display: block; opacity: .55; font-size: .72rem; }
    .wd-status { text-transform: uppercase; font-size: .72rem; font-weight: 700; letter-spacing: .05em; }

    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #111; border: 1px solid #22c55e; color: #fff; padding: .7rem 1.3rem;
      border-radius: 12px; opacity: 0; pointer-events: none; transition: .3s; z-index: 99;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes drop { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: none; } }
    @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>

  <div class="wrap">
    <header>
      <h1><span class="wiggle">💳</span> <span class="anim-gradient under-bar">My Wallet</span></h1>
      <a href="index.html">← Back</a>
    </header>

    <div class="marquee-wrap" style="margin-bottom:.8rem">
      <div class="marquee-inner">
        <span>💰 <b>SECURE</b> Escrow Wallet</span>
        <span>⚡ <b>INSTANT</b> UPI Withdrawals</span>
        <span>🛡️ Protected by <b>BGMI Market</b></span>
        <span>📊 Live <b>BALANCE</b> Tracking</span>
      </div>
    </div>

    <div class="grid">
      <div class="stat green card-in price-pulse" data-i="1"><small>Available Balance</small><div class="val" id="availableBalance">₹0</div></div>
      <div class="stat orange card-in price-pulse" data-i="2"><small>Escrow Held</small><div class="val" id="escrowHeld">₹0</div></div>
      <div class="stat violet card-in price-pulse" data-i="3"><small>Total Withdrawn</small><div class="val" id="totalWithdrawn">₹0</div></div>    </div>

    <div class="panel">
      <h2>Withdraw Earnings</h2>
      <div class="row">
        <input id="withdrawAmount" type="number" min="1" placeholder="Amount (₹)">
        <input id="upiId" type="text" placeholder="UPI ID (name@upi)">
      </div>
      <button class="btn" id="withdrawBtn">Request Withdrawal</button>
    </div>

    <div class="panel">
      <h2>Withdrawal History</h2>
      <div id="withdrawalsList"><p style="opacity:.6">Loading…</p></div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="js/wallet.js"></script>
  <script src="assets/effects.js" defer></script>
</body>
</html>
