<!DOCTYPE html>
<html lang="en">

<head>

	<link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css'>
	<style>
		@import url('https://fonts.googleapis.com/css?family=Montserrat:400,800');

		* { box-sizing: border-box; }

		body {
			background: #f6f5f7;
			display: flex;
			justify-content: center;
			align-items: center;
			flex-direction: column;
			font-family: 'Montserrat', sans-serif;
			height: 100vh;
			margin: -20px 0 50px;
		}

		h1 { font-weight: bold; margin: 0; }
		p { font-size: 14px; font-weight: 100; line-height: 20px; letter-spacing: 0.5px; margin: 20px 0 30px; }
		span { font-size: 12px; }

		a { color: #333; font-size: 14px; text-decoration: none; margin: 15px 0; }
		a:hover { color: #FF4B2B; }

		button {
			border-radius: 20px;
			border: 1px solid #FF4B2B;
			background-color: #FF4B2B;
			color: #FFFFFF;
			cursor: pointer;
			font-size: 12px;
			font-weight: bold;
			padding: 12px 45px;
			letter-spacing: 1px;
			text-transform: uppercase;
			transition: transform 80ms ease-in;
		}

		button:active { transform: scale(0.95); }
		button:focus { outline: none; }
		button:disabled { opacity: 0.6; cursor: not-allowed; }
		button.ghost { background-color: transparent; border-color: #FF4B2B; color: #FF4B2B; }

		form {
			background-color: #FFFFFF;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			padding: 0 50px;
			height: 100%;
			text-align: center;
		}

		input {
			background-color: #eee;
			border: none;
			padding: 12px 15px;
			margin: 8px 0;
			width: 100%;
		}

		.home-link {
			position: fixed;
			top: 18px;
			left: 24px;
			font-weight: 800;
			font-size: 1.05rem;
			letter-spacing: .04em;
			color: #222;
		}

		.container {
			background-color: #fff;
			border-radius: 10px;
			box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25), 0 10px 10px rgba(0, 0, 0, 0.22);
			position: relative;
			overflow: hidden;
			width: 480px;
			max-width: 94vw;
			min-height: 480px;
			display: flex;
		}

		.step { display: none; width: 100%; }
		.step.active { display: flex; }

		.step-icon {
			width: 54px;
			height: 54px;
			border-radius: 50%;
			background: linear-gradient(135deg, #FF4B2B, #FF416C);
			color: #fff;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 1.3rem;
			margin-bottom: 12px;
		}

		.otp-input {
			text-align: center;
			letter-spacing: 0.5rem;
			font-size: 1.2rem;
			font-weight: 700;
		}

		.msg-toast {
			position: fixed;
			bottom: 26px;
			left: 50%;
			transform: translateX(-50%);
			background: #222;
			color: #fff;
			padding: 11px 22px;
			border-radius: 24px;
			font-size: 13px;
			display: none;
			z-index: 600;
		}
	</style>
</head>

<body>

	<a class="home-link" href="index.html">⚡ BGMI Market</a>

	<div class="container">
		<!-- STEP 1: EMAIL -->
		<div class="step active" id="step1">
			<form onsubmit="event.preventDefault(); sendResetLink();" novalidate>
				<div class="step-icon"><i class="fa fa-lock"></i></div>
				<h1>Reset Password</h1>
				<p>Enter your registered email and we'll send you a 6-digit OTP</p>
				<input type="email" id="email" placeholder="Email" required autocomplete="email">
				<button type="submit" id="forgotBtn">Send OTP</button>
				<a href="login.html">Back to Sign in</a>
			</form>
		</div>
		<!-- STEP 2: OTP + NEW PASSWORD -->
		<div class="step" id="step2">
			<form onsubmit="event.preventDefault(); resetPassword();" novalidate>
				<div class="step-icon"><i class="fa fa-key"></i></div>
				<h1>Enter OTP</h1>
				<p id="otpHint">6-digit OTP aapke email par bheja gaya hai</p>
				<input type="text" id="resetToken" class="otp-input" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
				<input type="password" id="newPassword" placeholder="New Password (min 8 chars)" required minlength="8" autocomplete="new-password">
				<button type="submit" id="resetBtn">Reset Password</button>
				<a href="#" onclick="event.preventDefault(); showStep(1);">Wrong email? Go back</a>
			</form>
		</div>
	</div>

	<div class="msg-toast" id="msgToast"></div>

	<script>
		if (!window.showToast) {
			window.showToast = function (msg, type) {
				var t = document.getElementById("msgToast");
				t.textContent = msg;
				t.style.display = "block";
				t.style.background = type === "error" ? "#c0392b" : "#222";
				clearTimeout(window.__toastTimer);
				window.__toastTimer = setTimeout(function () { t.style.display = "none"; }, 3500);
			};
		}
		function showStep(n) {
			document.getElementById("step1").classList.toggle("active", n === 1);
			document.getElementById("step2").classList.toggle("active", n === 2);
		}
		window.showResetStep2 = function () {
			var emailVal = document.getElementById("email").value || "";
			document.getElementById("otpHint").textContent = "6-digit OTP sent to " + emailVal;
			showStep(2);
			setTimeout(function () { document.getElementById("resetToken").focus(); }, 300);
		};
	</script>
	<script src="js/auth.js?v=16"></script>

<script>

<script>
/* shared nav drawer + dynamic year */
(function(){var nt=document.getElementById("navToggle"),nl=document.getElementById("navLinks");if(nt&&nl){var ov=document.createElement("div");ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .28s;z-index:99997";document.body.appendChild(ov);function cls(){nl.classList.remove("open");ov.style.opacity="0";nt.setAttribute("aria-expanded","false")}nt.addEventListener("click",function(e){e.stopPropagation();var o=!nl.classList.contains("open");nl.classList.toggle("open",o);ov.style.opacity=o?"1":"0";ov.style.pointerEvents=o?"auto":"none";nt.setAttribute("aria-expanded",o)});ov.addEventListener("click",cls);document.addEventListener("keydown",function(e){if(e.key==="Escape")cls()});nl.addEventListener("click",function(e){if(e.target.closest(".nav-link"))cls()});}var y=new Date().getFullYear();document.querySelectorAll(".footer-copyright").forEach(function(el){el.innerHTML=el.innerHTML.replace(/20\d\d/,y)});})();
</script>
</body>

</html>
